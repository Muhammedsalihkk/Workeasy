
services:

  rabbit-mq:
      image: rabbitmq:3-management
      container_name: rabbit-mq
      ports:
        - "5672:5672"
        - "15672:15672"
      environment:
        RABBITMQ_DEFAULT_USER: workeasy
        RABBITMQ_DEFAULT_PASS: workeasy123
      networks:
        - workeasy_default

  auth-service:
    build:
      context: ./services/auth-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.services.auth.loadbalancer.server.port=3001"
    networks:
      - workeasy_default
    container_name: auth-service
    volumes:
      - ./services/auth-service:/app
    command: npx ts-node src/app.ts
    env_file:
      - ./services/auth-service/.env
    depends_on:
      - rabbit-mq


  company-service:
    build:
      context: ./services/company-services
    container_name: company-service
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.company.rule=PathPrefix(`/api/companies`)"
    - "traefik.http.services.company.loadbalancer.server.port=3000"
    networks:
      - workeasy_default
    volumes:
      - ./services/company-services:/app
    command: npx ts-node src/app.ts

    env_file:
      - ./services/company-services/.env
    depends_on:
      - rabbit-mq
      
  subscription-service:
    build: 
      context: ./services/subscription-service
    container_name: subscription-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.subscription.rule=PathPrefix(`/api/subscription`)"
      - "traefik.http.services.subscription.loadbalancer.server.port=3002"
    networks:
      - workeasy_default
    volumes:
      - ./services/subscription-service:/app
    command: npx ts-node src/app.ts
    env_file:
      - ./services/subscription-service/.env
    depends_on:
      - rabbit-mq

  attendence-server:
    build: 
      context: ./services/attendence
    container_name: attendence-services
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.attendence.rule=PathPrefix(`/api/attendence`)"
      - "traefik.http.routers.attendence.service=attendence"
      - "traefik.http.services.attendence.loadbalancer.server.port=3003"
    networks:
      - workeasy_default
    volumes:
      - ./services/attendence:/app
    command: sh -c "npx ts-node src/app.ts"
    env_file:
      - ./services/attendence/.env
    depends_on:
      - rabbit-mq

  traefik:
    image: traefik:v3.0
    command: 
      -  --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - workeasy_default
networks:
    workeasy_default:

